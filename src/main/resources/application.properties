# ==============================================
# DigitalBank App (HTTPS + Self Registration)
# ==============================================
spring.application.name=DigitalBank
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:digitalbank-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=digitalbankssl

# ==============================================
# Spring Boot Admin (same app - self registration)
# ==============================================
spring.boot.admin.client.url=http://localhost:8443
spring.boot.admin.client.instance.name=DigitalBank
spring.boot.admin.client.instance.service-base-url=http://localhost:8443
spring.boot.admin.client.instance.management-base-url=http://localhost:8443
spring.boot.admin.client.ssl.enabled=false                 # disable SSL verification (local only)
spring.boot.admin.client.instance.metadata.insecure=true   # allow self-signed
spring.boot.admin.client.instance.metadata.user.name=admin
spring.boot.admin.client.instance.metadata.user.password=admin123

# ==============================================
# Actuator Endpoints
# ==============================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always


# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=digitalbank-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


